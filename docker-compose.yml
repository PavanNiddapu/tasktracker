version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:5.0
    container_name: tasktracker-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tasktracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - tasktracker-network

  # Task Tracker backend
  backend:
    build: .
    container_name: tasktracker-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/tasktracker
    depends_on:
      - mongodb
    networks:
      - tasktracker-network

volumes:
  mongodb_data:

networks:
  tasktracker-network:
    driver: bridge