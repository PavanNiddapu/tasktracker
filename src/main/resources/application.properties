# Application Configuration
spring.application.name=tasktracker
spring.web.resources.static-locations=classpath:/ui/

# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/tasktracker
spring.data.mongodb.database=tasktracker

# Logging Configuration
logging.level.com.learn.tasktracker=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration (handled by CorsConfig class)
# Allows frontend to connect to backend APIs